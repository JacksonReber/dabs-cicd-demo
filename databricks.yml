bundle:
  name: dabs_cicd_demo

include:
  - resources/*.yml

# Variables are declared once. `catalog` and `env` are DERIVED from the target
# name (${bundle.target} = dev | prod), so standing up or maintaining an
# environment is just adding a target — there is no per-env catalog/env wiring
# to keep in sync. `quality_threshold` stays per-target because it is a genuine
# per-env policy knob, not something derivable from the name.
variables:
  catalog:
    description: >-
      Target Unity Catalog. Defaults to dabs_cicd_<env>, derived from the target
      name. Override with `--var catalog=...` to deploy somewhere else for ad-hoc
      testing (e.g. a sandbox workspace that doesn't have the dabs_cicd_* catalogs).
    default: dabs_cicd_${bundle.target}
  env:
    description: Environment label, read in pipeline code. Defaults to the target name.
    default: ${bundle.target}
  quality_threshold:
    description: Minimum trade_value a row must meet to pass the silver layer.
  deploy_service_principal:
    description: >-
      Application ID of the DEPLOY service principal. It authenticates CI/CD (GitHub
      OIDC), so it OWNS the deployed workspace files and holds CAN_MANAGE on the
      deployment — this is the tamper-proofing. It gets NO Unity Catalog data grants
      (least privilege). Separate from the run identity below.
    # REPLACE: the deploy SP's application ID (a UUID), created in README step 4.
    default: "<deploy-service-principal-application-id>"
  run_service_principal:
    description: >-
      Application ID of the RUN service principal — the identity the prod pipeline
      RUNS as (`run_as`). It holds the UC data grants (USE CATALOG, CREATE SCHEMA)
      and CAN_RUN on the deployed files, but never CAN_MANAGE — so it can read and
      execute the deployed code but cannot tamper with it. The deploy SP must have
      Service Principal User (CAN_USE) on this SP to assign it as run_as.
    # REPLACE: the run SP's application ID (a UUID), created in README step 4.
    default: "<run-service-principal-application-id>"

targets:
  # dev runs in DEVELOPMENT mode: each developer deploys to their OWN workspace home
  # (/Workspace/Users/<them>/.bundle/${bundle.name}/${bundle.target}) and the pipeline
  # runs as that developer — so developers never overwrite each other's deployments.
  # No `root_path` or `run_as` is needed here; that isolation is the development-mode
  # default. Resources are also prefixed with [dev <user>].
  dev:
    mode: development
    default: true
    workspace:
      host: https://<dev-workspace>.cloud.databricks.com   # REPLACE: your dev workspace URL
    variables:
      quality_threshold: "0"

  # Personal sandbox workspace. Same DEVELOPMENT-mode isolation as dev, but this
  # workspace has no dabs_cicd_* catalog, so the catalog var is overridden to an
  # existing catalog (the ad-hoc pattern the `catalog` variable doc calls out).
  sandbox:
    mode: development
    workspace:
      host: https://<sandbox-workspace>.cloud.databricks.com   # REPLACE: your sandbox workspace URL (or delete this whole target)
    variables:
      catalog: sandbox_catalog   # REPLACE: an existing catalog in that workspace (overrides the derived dabs_cicd_sandbox)
      quality_threshold: "0"

  # prod runs in PRODUCTION mode and is HARDENED so the deployed bundle artifacts
  # cannot be modified or deleted by ordinary users. It uses TWO service principals —
  # the Databricks-recommended least-privilege split (see docs/prod-oidc-deploy.md):
  #   - The DEPLOY SP authenticates CI/CD (GitHub OIDC) and runs `bundle deploy`, so
  #     it — never a human — OWNS the workspace files. File ownership comes from
  #     whoever authenticates the deploy, so `root_path` and the CAN_MANAGE lock are
  #     both keyed to the DEPLOY SP. It holds NO Unity Catalog data grants.
  #   - The RUN SP is only the execution identity (`run_as`). It holds the UC data
  #     grants and CAN_RUN on the files, but never CAN_MANAGE — so it can read and
  #     execute the deployed code but cannot tamper with it. The deploy SP needs
  #     Service Principal User (CAN_USE) on the run SP to assign it here.
  #   - Files deploy to the DEPLOY SP's OWN home, which is identity-neutral (a service
  #     identity, not a person) AND not world-writable — unlike /Workspace/Shared,
  #     which grants read/write to all workspace users.
  #   NOTE: workspace/account admins still bypass object ACLs by design. Real
  #   protection = few admins + guarded SP credentials (CI/CD secret store or OIDC,
  #   never on a laptop) + Git as the source of truth + audit logs — not ACLs alone.
  prod:
    mode: production
    # Pin the branch prod is allowed to deploy from. In production mode the CLI
    # validates that the deploy is running against this branch and refuses otherwise,
    # so a bundle can only reach prod through the intended release branch (`main`
    # here) — not from an arbitrary feature branch or a stale local checkout.
    git:
      branch: main
    workspace:
      host: https://<prod-workspace>.cloud.databricks.com   # REPLACE: your prod workspace URL
      # root_path resolves from the DEPLOY SP — it owns the files. No edit needed here.
      root_path: /Workspace/Users/${var.deploy_service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_service_principal}
    permissions:
      # Only the DEPLOY SP can manage the deployment — this is the tamper-proofing.
      - level: CAN_MANAGE
        service_principal_name: ${var.deploy_service_principal}
      # The RUN SP can read + execute the deployed code, but NOT edit/manage it.
      # (An explicit CAN_RUN is required — CAN_VIEW alone would not let it execute.)
      - level: CAN_RUN
        service_principal_name: ${var.run_service_principal}
      # Everyone else is read-only.
      - level: CAN_VIEW
        group_name: users
    variables:
      quality_threshold: "15000"
