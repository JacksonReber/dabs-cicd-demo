# CD promotion pipeline: on merge to `main`, deploy + integration-test STAGING, and
# only if that succeeds, deploy + run PROD (behind the `prod` Environment's approval
# gate). This is the second half of the validate → deploy → run lifecycle, and the
# promotion order best practice calls for: staging first, prod only after it passes.
#
# Why one workflow with `needs:` instead of two independent ones: it makes the gate
# explicit and enforceable — prod literally cannot start until staging deploys and its
# pipeline run succeeds. (databricks/mlops-stacks splits staging vs prod by branch —
# `main` → staging, `release` → prod. This repo keeps a single protected branch and
# chains the jobs instead, which is a cleaner fit for one repo + approval gates.)
#
# Both environments authenticate as their OWN service principal via GitHub OIDC — no
# stored Databricks secret. See docs/prod-oidc-deploy.md for the one-time SP +
# federation-policy setup (staging needs the same setup, scoped to `:environment:staging`).
#
# NOTE: this workflow is a reference deliverable. It has not been executed against the
# internal sandbox environment, which enforces a corp-egress-only IP ACL that 403s
# GitHub-hosted runners at the network layer. Run it against a customer workspace with
# no such ACL, or use a self-hosted runner inside the allowed network.
#
# Refs:
#   - https://github.com/databricks/mlops-stacks (bundle-cd-staging / bundle-cd-prod)
#   - https://docs.databricks.com/aws/en/dev-tools/ci-cd/github

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # --- STAGING: deploy + integration test -----------------------------------------
  # Runs unconditionally on merge. Deploys as the staging SP, then `bundle run`
  # executes the pipeline end-to-end — that run IS the integration test: if the
  # medallion pipeline can't build in a real workspace, staging fails and prod is
  # never reached.
  deploy-staging:
    runs-on: ubuntu-latest
    concurrency: dabs-cicd-staging   # never overlap two staging deploys
    environment: staging
    permissions:
      id-token: write
      contents: read
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_STAGING_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_STAGING_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle (staging)
        run: databricks bundle validate -t staging
      - name: Deploy bundle (staging)
        run: databricks bundle deploy -t staging
      - name: Run pipeline (staging) — integration test
        run: databricks bundle run dabs_cicd_pipeline -t staging

  # --- PROD: deploy + run, gated on staging ---------------------------------------
  # `needs: deploy-staging` is the hard gate — prod does not start unless staging fully
  # succeeded. The `prod` GitHub Environment adds the human approval gate on top (attach
  # required reviewers there). Deploys as the prod SP; the prod target is hardened
  # (SP-owned files, permissions lock, git.branch: main) in databricks.yml.
  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    concurrency: dabs-cicd-prod
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle (prod)
        run: databricks bundle validate -t prod
      - name: Deploy bundle (prod)
        run: databricks bundle deploy -t prod
      - name: Run pipeline (prod)
        run: databricks bundle run dabs_cicd_pipeline -t prod
