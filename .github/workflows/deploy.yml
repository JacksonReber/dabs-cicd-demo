# CD pipeline: on merge to `main`, deploy + run PROD, behind the `prod` Environment's
# approval gate. This is the second half of the validate → deploy → run lifecycle
# (the first half, PR validation, is ci.yml).
#
# This repo deploys straight to prod on merge. A production-grade setup usually
# promotes through a stable pre-prod environment first (deploy + integration-test
# STAGING, then prod only if it passes). Staging was intentionally left out here to
# keep the reference minimal — the README "Caveats and decisions" section explains
# exactly how to add a staging stage back (a second job gated with `needs:`).
#
# Prod authenticates as its OWN service principal via GitHub OIDC — no stored
# Databricks secret. See docs/prod-oidc-deploy.md for the one-time SP +
# federation-policy setup.
#
# NOTE: this workflow is a reference deliverable. It has not been executed against the
# internal sandbox environment, which enforces a corp-egress-only IP ACL that 403s
# GitHub-hosted runners at the network layer. Run it against a customer workspace with
# no such ACL, or use a self-hosted runner inside the allowed network.
#
# Refs:
#   - https://github.com/databricks/mlops-stacks (bundle-cd-prod)
#   - https://docs.databricks.com/aws/en/dev-tools/ci-cd/github

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # --- PROD: deploy + run ----------------------------------------------------------
  # Runs on merge to `main`. The `prod` GitHub Environment provides the human approval
  # gate (attach required reviewers there). Deploys as the prod SP; the prod target is
  # hardened (SP-owned files, permissions lock, git.branch: main) in databricks.yml.
  deploy-prod:
    runs-on: ubuntu-latest
    concurrency: dabs-cicd-prod
    environment: prod
    # Scopes this job's GITHUB_TOKEN (declaring a block sets all unlisted perms to none = least privilege).
    permissions:
      id-token: write   # REQUIRED: mint the GitHub OIDC token that Databricks exchanges for SP auth
      contents: read    # let actions/checkout clone the repo
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      # `vars.*` reads GitHub Actions configuration variables — set them in the GitHub UI
      # (Settings → Secrets and variables → Actions → Variables) or via `gh variable set`.
      # They live in THIS repo's GitHub settings, not in the code, so a clone/fork does NOT
      # copy them; if unset, `vars.*` is empty and the deploy fails at auth.
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}        # config variable: prod workspace URL
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }} # config variable: prod SP application ID (an identifier, not a secret)
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle (prod)
        run: databricks bundle validate -t prod
      - name: Deploy bundle (prod)
        run: databricks bundle deploy -t prod
      - name: Run pipeline (prod)
        run: databricks bundle run dabs_cicd_pipeline -t prod
